services:
  sat-web:
    build: .
    image: sat-web
    # Default: publish the port so the dashboard is reachable at http://localhost:8087 on
    # Windows, macOS and Linux (Docker Desktop included).
    ports:
      - "8087:8087"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      # Bind to all interfaces on 8087 inside the container. Open it at http://localhost:8087.
      - ASPNETCORE_URLS=http://0.0.0.0:8087
    restart: unless-stopped

    # ── Live capture on NATIVE LINUX ──────────────────────────────────────────────────────────
    # To capture real Albion traffic, the container must share the host's network. On a native
    # Linux host, DELETE the `ports:` block above and uncomment the line below instead. (Host
    # networking is NOT supported on Docker Desktop for Windows/macOS — there it only serves the
    # dashboard via the published port and cannot see host traffic.)
    #
    # network_mode: host
